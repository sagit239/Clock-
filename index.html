<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>שעון חלל</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Heebo:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #02010a;
      font-family: 'Heebo', sans-serif;
      color: #fff;
    }

    canvas#space {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Nebula glow layers */
    .nebula {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.45;
      pointer-events: none;
      animation: drift 40s ease-in-out infinite alternate;
    }
    .nebula.n1 { width: 60vmax; height: 60vmax; top: -20vmax; left: -15vmax;
      background: radial-gradient(circle, #6a1bff 0%, transparent 70%); }
    .nebula.n2 { width: 50vmax; height: 50vmax; bottom: -20vmax; right: -10vmax;
      background: radial-gradient(circle, #ff2d95 0%, transparent 70%); animation-duration: 55s; }
    .nebula.n3 { width: 40vmax; height: 40vmax; top: 30%; right: 25%;
      background: radial-gradient(circle, #00c8ff 0%, transparent 70%); opacity: 0.25; animation-duration: 70s; }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(5vmax, 3vmax) scale(1.15); }
    }

    /* Planet */
    .planet {
      position: fixed;
      width: 22vmin; height: 22vmin;
      bottom: 8vh; left: 8vw;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 30%, #ffd9a8 0%, #e2894a 35%, #8a3a1e 70%, #2a0d06 100%);
      box-shadow: 0 0 60px 10px rgba(255, 140, 70, 0.35), inset -20px -20px 50px rgba(0,0,0,0.7);
      animation: float 12s ease-in-out infinite;
    }
    .planet::after {
      content: '';
      position: absolute;
      width: 170%; height: 40%;
      top: 30%; left: -35%;
      border-radius: 50%;
      border: 3px solid rgba(255, 220, 180, 0.55);
      box-shadow: 0 0 12px rgba(255, 200, 150, 0.5);
      transform: rotate(-18deg);
    }

    .moon {
      position: fixed;
      width: 6vmin; height: 6vmin;
      top: 12vh; right: 12vw;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff, #b9c4d9 50%, #4b5568 100%);
      box-shadow: 0 0 30px 6px rgba(200, 220, 255, 0.4);
      animation: float 9s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-14px); }
    }

    /* Clock */
    .clock-wrap {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      padding: 16px;
      text-align: center;
    }

    .panel {
      padding: 2.2rem 3rem;
      border-radius: 28px;
      background: rgba(10, 8, 35, 0.35);
      border: 1px solid rgba(160, 140, 255, 0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow:
        0 0 40px rgba(120, 80, 255, 0.35),
        inset 0 0 30px rgba(120, 80, 255, 0.15);
      max-width: 100%;
    }

    .time {
      direction: ltr;
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: clamp(2.8rem, 12vw, 9rem);
      letter-spacing: 0.04em;
      line-height: 1;
      background: linear-gradient(180deg, #ffffff 0%, #b8e8ff 45%, #a77bff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 18px rgba(130, 200, 255, 0.8)) drop-shadow(0 0 40px rgba(160, 100, 255, 0.6));
      white-space: nowrap;
    }

    .time .colon {
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0.25; } }

    .time .sec {
      font-size: 0.45em;
      vertical-align: top;
      margin-left: 0.15em;
      opacity: 0.85;
    }

    .date {
      margin-top: 1rem;
      font-size: clamp(1rem, 3vw, 1.6rem);
      font-weight: 300;
      color: #cfd8ff;
      letter-spacing: 0.05em;
      text-shadow: 0 0 10px rgba(150, 170, 255, 0.7);
    }

    .subtitle {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.7rem, 2vw, 0.95rem);
      letter-spacing: 0.5em;
      color: rgba(200, 210, 255, 0.6);
      direction: ltr;
    }

    @media (max-width: 600px) {
      .panel { padding: 1.5rem 1.2rem; border-radius: 20px; }
    }
  </style>
</head>
<body>
  <canvas id="space"></canvas>
  <div class="nebula n1"></div>
  <div class="nebula n2"></div>
  <div class="nebula n3"></div>
  <div class="planet"></div>
  <div class="moon"></div>

  <main class="clock-wrap">
    <div class="subtitle">SPACE TIME</div>
    <div class="panel">
      <div class="time" id="time">00<span class="colon">:</span>00<span class="sec">00</span></div>
      <div class="date" id="date"></div>
    </div>
  </main>

  <script>
    // ---------- Clock ----------
    const timeEl = document.getElementById('time');
    const dateEl = document.getElementById('date');
    const pad = n => String(n).padStart(2, '0');

    function updateClock() {
      const now = new Date();
      timeEl.innerHTML =
        `${pad(now.getHours())}<span class="colon">:</span>${pad(now.getMinutes())}<span class="sec">${pad(now.getSeconds())}</span>`;
      dateEl.textContent = now.toLocaleDateString('he-IL', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ---------- Starfield ----------
    const canvas = document.getElementById('space');
    const ctx = canvas.getContext('2d');
    let w, h, stars = [], shooting = [];
    const STAR_COLORS = ['#ffffff', '#cfe3ff', '#ffe9c4', '#d9c8ff', '#a8d8ff'];

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      createStars();
    }

    function createStars() {
      const count = Math.floor((w * h) / 2500);
      stars = Array.from({ length: count }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.4 + 0.2,
        depth: Math.random() * 0.8 + 0.2,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.03 + 0.005,
        color: STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)]
      }));
    }

    function spawnShootingStar() {
      shooting.push({
        x: Math.random() * w * 0.8 + w * 0.2,
        y: Math.random() * h * 0.4,
        len: Math.random() * 120 + 80,
        speed: Math.random() * 8 + 8,
        life: 1
      });
    }

    let mouseX = 0, mouseY = 0;
    window.addEventListener('mousemove', e => {
      mouseX = (e.clientX / w - 0.5) * 2;
      mouseY = (e.clientY / h - 0.5) * 2;
    });

    function draw() {
      ctx.clearRect(0, 0, w, h);

      // Stars (twinkle + parallax)
      for (const s of stars) {
        s.phase += s.speed;
        const alpha = 0.5 + Math.sin(s.phase) * 0.5;
        const x = s.x - mouseX * 15 * s.depth;
        const y = s.y - mouseY * 15 * s.depth;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(x, y, s.r, 0, Math.PI * 2);
        ctx.fill();

        // Glow cross for bright stars
        if (s.r > 1.3 && alpha > 0.8) {
          ctx.globalAlpha = alpha * 0.4;
          ctx.strokeStyle = s.color;
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.moveTo(x - 5, y); ctx.lineTo(x + 5, y);
          ctx.moveTo(x, y - 5); ctx.lineTo(x, y + 5);
          ctx.stroke();
        }
      }

      // Shooting stars
      if (Math.random() < 0.012) spawnShootingStar();
      for (let i = shooting.length - 1; i >= 0; i--) {
        const s = shooting[i];
        s.x -= s.speed;
        s.y += s.speed * 0.5;
        s.life -= 0.015;
        const grad = ctx.createLinearGradient(s.x, s.y, s.x + s.len, s.y - s.len * 0.5);
        grad.addColorStop(0, `rgba(255,255,255,${s.life})`);
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.globalAlpha = 1;
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x + s.len, s.y - s.len * 0.5);
        ctx.stroke();
        if (s.life <= 0 || s.x < -s.len || s.y > h + s.len) shooting.splice(i, 1);
      }

      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    draw();
  </script>
</body>
</html>
